<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание лаборатории</title>
  <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
  <main class="page">
    <h1>Расписание компьютерной лаборатории</h1>
    <!-- Создайте здесь семантическую таблицу по заданию -->
     <table class="schedule_table" border="1">
      <thead>
        <tr>
          <th  scope="col">День</th>
          <th scope="col">9:00-10:30</th>
          <th scope="col">10:40-12:10</th>
          <th scope="col">12:40-14:10</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row" class="r">Понедельник</th>
          <td class="r">веб-разработка</td>
          <td class="r">свободно</td>
          <td class="r">свободно</td>
        </tr>
        <tr>
          <th scope="row" class="r">Вторник</th>
          <td class="r">веб-разработка</td>
          <td class="r">свободно</td>
          <td class="r">свободно</td>
        </tr>
        <tr>
          <th scope="row" class="r">среда</th>
          <td class="r">веб-разработка</td>
          <td class="r">свободно</td>
          <td class="r">свободно</td>
        </tr>
        <tr>
          <th scope="row" class="r">четверг</th>
          <td class="r">веб-разработка</td>
          <td colspan="2" class="r">техническое обслуживание</td>

        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th scope="col">свободные окна</th>
          <td>6</td>
        </tr>
      </tfoot>
     </table>
  </main>
</body>
</html>
